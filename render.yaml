services:
  - type: web
    name: signalguard-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SIGNALGUARD_DEMO_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
